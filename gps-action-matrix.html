<title>Essential GPS — Action Task Decision Matrix</title>
<style>
:root{
  --bg:#fbfbfd;--sf:#fff;--sf2:#f5f5f7;--sf3:#e8e8ed;
  --tx:#1d1d1f;--tx2:#424245;--tx3:#6e6e73;--txm:#86868b;
  --bd:#d2d2d7;
  --blue:#0071e3;--purple:#bf5af2;--green:#34c759;
  --red:#ff3b30;--orange:#ff9500;--teal:#5ac8fa;--indigo:#5856d6;
  --r:20px;--rs:12px;
  --fs-micro:10px;--fs-cap:11px;--fs-body:13px;--fs-body-lg:15px;--fs-sub:17px;--fs-t3:20px;--fs-t2:24px;--fs-t1:28px;--fs-disp:34px;
  --f:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard',system-ui,sans-serif;
  --fm:'SF Mono','Fira Code',ui-monospace,monospace;
  --sh:0 1px 3px rgba(0,0,0,.04);--shm:0 4px 16px rgba(0,0,0,.06);--shl:0 8px 32px rgba(0,0,0,.08);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#000;--sf:#1c1c1e;--sf2:#2c2c2e;--sf3:#3a3a3c;
  --tx:#f5f5f7;--tx2:#d1d1d6;--tx3:#98989d;--txm:#636366;
  --bd:#38383a;
  --blue:#0a84ff;--purple:#bf5af2;--green:#30d158;
  --red:#ff453a;--orange:#ff9f0a;--teal:#64d2ff;--indigo:#5e5ce6;
  --sh:0 1px 3px rgba(0,0,0,.3);--shm:0 4px 16px rgba(0,0,0,.3);--shl:0 8px 32px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{--bg:#000;--sf:#1c1c1e;--sf2:#2c2c2e;--sf3:#3a3a3c;--tx:#f5f5f7;--tx2:#d1d1d6;--tx3:#98989d;--txm:#636366;--bd:#38383a;--blue:#0a84ff;--purple:#bf5af2;--green:#30d158;--red:#ff453a;--orange:#ff9f0a;--teal:#64d2ff;--indigo:#5e5ce6;--sh:0 1px 3px rgba(0,0,0,.3);--shm:0 4px 16px rgba(0,0,0,.3);--shl:0 8px 32px rgba(0,0,0,.35)}
:root[data-theme="light"]{--bg:#fbfbfd;--sf:#fff;--sf2:#f5f5f7;--sf3:#e8e8ed;--tx:#1d1d1f;--tx2:#424245;--tx3:#6e6e73;--txm:#86868b;--bd:#d2d2d7;--blue:#0071e3;--purple:#bf5af2;--green:#34c759;--red:#ff3b30;--orange:#ff9500;--teal:#5ac8fa;--indigo:#5856d6;--sh:0 1px 3px rgba(0,0,0,.04);--shm:0 4px 16px rgba(0,0,0,.06);--shl:0 8px 32px rgba(0,0,0,.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--f);background:var(--bg);color:var(--tx);line-height:1.5;-webkit-font-smoothing:antialiased}
.page{max-width:1040px;margin:0 auto;padding:32px 24px 120px}
.hero{text-align:center;padding:40px 0 36px}
.hero-ey{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--red);margin-bottom:6px}
.hero h1{font-size:34px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.hero p{font-size:15px;color:var(--tx2);max-width:600px;margin:0 auto}
.sec{margin-top:48px}
.sec-t{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.sec-d{font-size:15px;color:var(--tx3);margin-bottom:20px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:24px;box-shadow:var(--shm)}

/* Tier selector */
.tier-sel{display:flex;gap:6px;margin-bottom:24px;flex-wrap:wrap}
.tier-btn{padding:10px 24px;border-radius:100px;border:2px solid var(--bd);background:var(--sf);font-family:var(--f);font-size:15px;font-weight:700;cursor:pointer;transition:all .25s;color:var(--tx2);display:flex;align-items:center;gap:8px}
.tier-btn .cnt{font-size:11px;font-weight:800;background:var(--sf2);padding:2px 8px;border-radius:100px;color:var(--tx3);transition:all .25s}
.tier-btn.active{color:#fff;border-color:transparent}
.tier-btn.active .cnt{background:rgba(255,255,255,.25);color:#fff}
.tier-btn[data-t="S"].active{background:var(--red)}
.tier-btn[data-t="A"].active{background:var(--orange)}
.tier-btn[data-t="B"].active{background:var(--blue)}
.tier-btn[data-t="C"].active{background:var(--txm)}

/* Stats strip */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px}
.stat{background:var(--sf2);border-radius:var(--rs);padding:14px 16px;text-align:center}
.stat-v{font-size:24px;font-weight:800;letter-spacing:-.02em}
.stat-l{font-size:11px;font-weight:600;color:var(--tx3);margin-top:2px}

/* Decision flow */
.flow{display:flex;flex-direction:column;gap:0}
.flow-node{position:relative;padding:20px 24px;border:1px solid var(--bd);background:var(--sf);transition:all .25s;cursor:pointer}
.flow-node:first-child{border-radius:var(--r) var(--r) 0 0}
.flow-node:last-child{border-radius:0 0 var(--r) var(--r)}
.flow-node+.flow-node{border-top:none}
.flow-node:hover{background:var(--sf2)}
.flow-node.open{background:var(--sf)}
.flow-head{display:flex;align-items:center;gap:12px}
.flow-id{font-size:11px;font-weight:800;padding:4px 10px;border-radius:100px;color:#fff;flex-shrink:0;min-width:48px;text-align:center;letter-spacing:.02em}
.flow-trigger{flex:1;display:flex;flex-direction:column;gap:2px}
.flow-name{font-size:15px;font-weight:700}
.flow-cond{font-size:11px;color:var(--tx3);font-family:var(--fm)}
.flow-axes{display:flex;gap:4px;flex-shrink:0}
.flow-ax{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;border:1.5px solid var(--bd)}
.flow-ax.crit{background:rgba(255,59,48,.12);border-color:var(--red);color:var(--red)}
.flow-ax.warn{background:rgba(255,149,0,.12);border-color:var(--orange);color:var(--orange)}
.flow-ax.good{background:rgba(52,199,89,.1);border-color:var(--green);color:var(--green)}
.flow-ax.any{background:var(--sf2);color:var(--txm)}
.flow-chev{color:var(--txm);font-size:11px;transition:transform .2s;flex-shrink:0;margin-left:8px}
.flow-node.open .flow-chev{transform:rotate(90deg)}

/* Expanded detail */
.flow-detail{display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--sf2)}
.flow-node.open .flow-detail{display:block}
.task-list{list-style:none;display:flex;flex-direction:column;gap:10px}
.task{display:flex;gap:12px;align-items:flex-start}
.task-pri{font-size:10px;font-weight:800;padding:3px 8px;border-radius:100px;flex-shrink:0;margin-top:2px;letter-spacing:.03em}
.task-pri.p1{background:rgba(255,59,48,.12);color:var(--red)}
.task-pri.p2{background:rgba(255,149,0,.12);color:var(--orange)}
.task-pri.p3{background:rgba(0,113,227,.1);color:var(--blue)}
.task-body{flex:1}
.task-name{font-size:15px;font-weight:700;margin-bottom:2px}
.task-desc{font-size:13px;color:var(--tx2);line-height:1.55}
.task-metric{font-size:11px;font-family:var(--fm);color:var(--tx3);margin-top:4px;display:flex;flex-wrap:wrap;gap:8px}
.task-metric span{background:var(--sf2);padding:2px 8px;border-radius:6px}

/* Combo badge */
.combo{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px;margin-left:8px}
.combo-and{background:rgba(191,90,242,.1);color:var(--purple)}
.combo-or{background:rgba(90,200,250,.1);color:var(--teal)}

/* Summary table */
.sum-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--bd);background:var(--sf);box-shadow:var(--shm)}
.sum{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;min-width:800px}
.sum th{padding:10px 14px;text-align:left;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);background:var(--sf2);border-bottom:2px solid var(--bd);white-space:nowrap;position:sticky;top:0}
.sum td{padding:10px 14px;border-bottom:1px solid var(--sf2);vertical-align:top;line-height:1.5}
.sum tr:last-child td{border-bottom:none}
.sum tr:hover td{background:var(--sf2)}

.ax-chip{font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;display:inline-block;margin:1px 2px}
.ax-chip.c{background:rgba(255,59,48,.1);color:var(--red)}
.ax-chip.w{background:rgba(255,149,0,.1);color:var(--orange)}
.ax-chip.g{background:rgba(52,199,89,.08);color:var(--green)}

@media(max-width:640px){
  .hero h1{font-size:28px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .flow-axes{display:none}
  .flow-head{flex-wrap:wrap}
}
</style>

<script>
var DATA = {
  S: [
    {

var AX_SHORT = ['가','딜','모','지','리','배'];

function showT(tier) {
  document.querySelectorAll('.tier-btn').forEach(function(b){b.classList.remove('active')});
  document.querySelector('.tier-btn[data-t="'+tier+'"]').classList.add('active');
  renderFlow(tier);
}

function renderFlow(tier) {
  var container = document.getElementById('flows');
  var items = DATA[tier];
  if(!items){container.innerHTML='';return;}
  var html = '<div class="flow">';
  items.forEach(function(item){
    var axHtml = '';
    item.axes.forEach(function(st,i){
      axHtml += '<div class="flow-ax '+st+'" title="'+AX_SHORT[i]+'">'+AX_SHORT[i]+'</div>';
    });
    var tasksHtml = '<ul class="task-list">';
    item.tasks.forEach(function(t){
      var metricHtml = '';
      if(t.metric){
        metricHtml = '<div class="task-metric">';
        t.metric.forEach(function(m){metricHtml+='<span>'+m+'</span>';});
        metricHtml += '</div>';
      }
      tasksHtml += '<li class="task"><div class="task-pri '+t.pri.toLowerCase()+'">'+t.pri+'</div><div class="task-body"><div class="task-name">'+t.name+'</div><div class="task-desc">'+t.desc+'</div>'+metricHtml+'</div></li>';
    });
    tasksHtml += '</ul>';

    var tierColor = tier==='S'?'var(--red)':tier==='A'?'var(--orange)':tier==='B'?'var(--blue)':'var(--txm)';
    html += '<div class="flow-node" onclick="this.classList.toggle(\'open\')">';
    html += '<div class="flow-head">';
    html += '<div class="flow-id" style="background:'+tierColor+'">'+item.id+'</div>';
    html += '<div class="flow-trigger"><div class="flow-name">'+item.name+'</div><div class="flow-cond">'+item.cond+'</div></div>';
    html += '<div class="flow-axes">'+axHtml+'</div>';
    html += '<span class="flow-chev">&#9654;</span>';
    html += '</div>';
    html += '<div class="flow-detail">'+tasksHtml+'</div>';
    html += '</div>';
  });
  html += '</div>';
  container.innerHTML = html;
}

function buildSummary() {
  var body = document.getElementById('sumBody');
  var n = 0;
  var tierColors = {S:'var(--red)',A:'var(--orange)',B:'var(--blue)',C:'var(--txm)'};
  ['S','A','B','C'].forEach(function(tier){
    DATA[tier].forEach(function(item){
      n++;
      var axHtml = '';
      item.axes.forEach(function(st,i){
        var cls = st==='crit'?'c':st==='warn'?'w':st==='good'?'g':'';
        if(cls) axHtml += '<span class="ax-chip '+cls+'">'+AX_SHORT[i]+'</span>';
      });
      var taskNames = item.tasks.map(function(t){return t.name}).join(', ');
      var doneMetric = item.tasks[0].metric ? item.tasks[0].metric[0] : '-';
      var tr = document.createElement('tr');
      tr.innerHTML = '<td style="font-weight:700;font-variant-numeric:tabular-nums">'+n+'</td>'
        +'<td><span style="font-size:11px;font-weight:800;padding:3px 8px;border-radius:100px;color:#fff;background:'+tierColors[tier]+'">'+tier+'</span></td>'
        +'<td style="font-weight:700;font-size:13px">'+item.name+'</td>'
        +'<td>'+axHtml+'</td>'
        +'<td style="font-size:13px;color:var(--tx2)">'+taskNames+'</td>'
        +'<td style="font-size:11px;font-family:var(--fm);color:var(--tx3)">'+doneMetric+'</td>';
      body.appendChild(tr);
    });
  });
}

renderFlow('S');
buildSummary();
</script>
